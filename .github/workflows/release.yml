name: Release

# Build and publish the Python package for semver release tags only
# (e.g. v1.2.3, v1.2.3-rc.1). Non-semver tags never trigger this workflow —
# the tag filter below plus the strict validation step ignore them.
on:
  push:
    tags:
      # Coarse prefilter; the "Validate semver tag" step enforces real semver.
      - 'v[0-9]*.[0-9]*.[0-9]*'

# Default to read-only; publishing jobs opt into only the permission they need.
permissions:
  contents: read

jobs:
  # Gate: the package is only built and published if the mock-only suite passes.
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history for version derivation)
        uses: actions/checkout@v4
        with:
          # Editable install triggers hatch-vcs, which needs the tag + history.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install package with dev dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run test suite (mocks only, no hardware)
        run: python -m pytest

  build:
    name: Build distributions
    needs: test
    runs-on: ubuntu-latest
    outputs:
      prerelease: ${{ steps.semver.outputs.prerelease }}
    steps:
      - name: Checkout (full history for version derivation)
        uses: actions/checkout@v4
        with:
          # hatch-vcs derives the package version from the git tag, which needs
          # the tag and history present — a shallow clone would hide them.
          fetch-depth: 0

      - name: Validate semver tag
        id: semver
        run: |
          tag="${GITHUB_REF_NAME}"
          echo "Tag: $tag"
          # Official SemVer 2.0.0 grammar, with a required leading `v`.
          semver='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-((0|[1-9][0-9]*|[0-9]*[a-zA-Z-][0-9a-zA-Z-]*)(\.(0|[1-9][0-9]*|[0-9]*[a-zA-Z-][0-9a-zA-Z-]*))*))?(\+([0-9a-zA-Z-]+(\.[0-9a-zA-Z-]+)*))?$'
          if ! printf '%s' "$tag" | grep -Eq "$semver"; then
            echo "::error::Tag '$tag' is not a valid semver tag (expected vMAJOR.MINOR.PATCH[-prerelease][+build]); refusing to release."
            exit 1
          fi
          # Version without the leading 'v' and its numeric core (pre-normalization).
          version="${tag#v}"
          core="${version%%[-+]*}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "core=$core" >> "$GITHUB_OUTPUT"
          # A tag carrying a prerelease segment is marked as a GitHub pre-release.
          if printf '%s' "$version" | grep -q '-'; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build tooling
        run: python -m pip install --upgrade build

      - name: Build sdist and wheel
        run: python -m build

      - name: Verify built version matches the tag
        run: |
          core='${{ steps.semver.outputs.core }}'
          echo "Built artifacts:"
          ls -1 dist/
          # hatch-vcs/PEP 440 may normalize a prerelease (v1.2.3-rc.1 -> 1.2.3rc1),
          # so match on the numeric core rather than the exact tag string.
          shopt -s nullglob
          wheels=(dist/trecu-"$core"*.whl)
          sdists=(dist/trecu-"$core"*.tar.gz)
          if [ ${#wheels[@]} -eq 0 ] || [ ${#sdists[@]} -eq 0 ]; then
            echo "::error::Built version does not match tag core '$core'. Got: $(ls dist/)"
            exit 1
          fi

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error

  pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/trecu
    permissions:
      # PyPI Trusted Publishing exchanges GitHub's OIDC identity for a
      # short-lived upload token, so no long-lived API token is stored.
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Create GitHub Release with artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          prerelease_flag=""
          if [ '${{ needs.build.outputs.prerelease }}' = 'true' ]; then
            prerelease_flag="--prerelease"
          fi
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            $prerelease_flag
