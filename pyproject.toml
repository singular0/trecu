[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "trecu"
# Version is derived from the git tag at build time (see [tool.hatch.version]);
# a release tag like `v1.2.3` produces the package version `1.2.3`.
dynamic = ["version"]
description = "TUI to read and decode ECU fault codes from Triumph motorcycles over a KKL (FT232RL) K-line cable"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
authors = [{ name = "Denis Yantarev", email = "denis.yantarev@gmail.com" }]
keywords = ["triumph", "motorcycle", "ecu", "iso9141", "obd", "kkl", "ftdi", "diagnostics"]

# Kept intentionally small and to well-maintained libraries only.
dependencies = [
    "textual>=0.60",   # modern async TUI framework
    "pyserial>=3.5",   # serial access to the FT232RL virtual COM port
    "rich>=13.0",      # pulled in by textual; used directly for formatting too
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
trecu = "trecu.cli:main"

[tool.hatch.version]
# hatch-vcs reads the version straight from the latest git tag, so the built
# package version always matches the release tag (no manual bump to keep in sync).
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["trecu"]

[tool.pytest.ini_options]
testpaths = ["tests"]
